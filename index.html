<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Submit CSR</title>
    <script>
        function submitCSR(event) {
            event.preventDefault();
            // You can add form data handling logic here
            document.getElementById("confirmation").innerText = "CSR request successfully submitted.";
        }
    </script>
</head>
<body>
    <div class="container">
        <h1>Submit CSR</h1>
        <form onsubmit="submitCSR(event)">
            <label for="csrName">CSR Name:</label>
            <input type="text" id="csrName" name="csrName" required>
            <br><br>
            <input type="submit" value="Submit CSR">
        </form>
        <p id="confirmation"></p>
    </div>
</body>
</html>
