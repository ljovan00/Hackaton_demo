<!DOCTYPE html>
<html>
<head>
<title>Simple App</title>
<style>
.random-font {
  font-size: calc(12px + (24 - 12) * random());
}
</style>
<script>
function applyRandomFontSize() {
  const elements = document.querySelectorAll('body *');
  elements.forEach(el => {
    const randomSize = Math.floor(Math.random() * (32 - 10 + 1)) + 10;
    el.style.fontSize = randomSize + 'px';
  });
}
window.onload = applyRandomFontSize;
</script>
</head>
<body>
<h1 class="random-font">Welcome to Simple App</h1>
<p class="random-font">This is the index page with random font sizes.</p>
</body>
</html>
